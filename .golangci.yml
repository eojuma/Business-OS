version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  build-tags: []
  go: "1.25"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - exhaustive
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  disable:
    - depguard
    - exhaustruct
    - gochecknoglobals
    - lll
    - unparam
    - wsl
  settings:
    gocognit:
      min-complexity: 100
    gocyclo:
      min-complexity: 60
    goconst:
      min-len: 5
      min-occurrences: 5
    errcheck:
      check-type-assertions: true
      check-blank: false
    revive:
      confidence: 0.8
      rules:
        - name: exported
          severity: warning
          disabled: true
        - name: unexported-return
          severity: warning
          disabled: false
    staticcheck:
      checks:
        - all
        - "-S1016"
        - "-ST1000"
        - "-ST1021"

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true